name: Release

# Publishes @etus/bhono (packages/bhono-app) to npm.
#
# Trigger: push to master/main (changesets opens/merges the release PR which
# triggers this workflow again to publish), or manual workflow_dispatch.
#
# Publish auth: npm Trusted Publisher (OIDC) — no NPM_TOKEN secret required.
# Configure once at https://www.npmjs.com/package/@etus/bhono/settings, then
# the `id-token: write` permission below is sufficient. Mirrors the pattern
# used by @etus/auth (aabrius/oauth-gateway/.github/workflows/publish-auth.yml).
#
# Pre-publish quality gates run before `npm publish` so a broken build/test
# never reaches the registry. We use the npm CLI (not pnpm) for the publish
# step itself — npm has first-class OIDC trusted-publisher support; pnpm's
# exchange handshake is less mature and currently 404s on the npm side.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write       # changesets/action needs to push the release PR
  pull-requests: write  # changesets/action opens the release PR
  id-token: write       # npm OIDC trusted publisher

jobs:
  release:
    name: Release @etus/bhono
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm to >=11.5.1 (trusted-publisher support)
        run: npm install -g npm@latest

      - name: Install CLI dependencies only
        # --filter '@etus/bhono...' scopes installed node_modules to the CLI
        # workspace + transitive deps. BUT pnpm still resolves the full
        # lockfile (incl. @etus/auth from src/server/*), so NPM_TOKEN with
        # @etus read scope is needed whenever the cache misses (any lockfile
        # change invalidates it). OIDC trusted publisher only covers publish,
        # not registry reads — so NPM_TOKEN remains required for install.
        run: pnpm install --frozen-lockfile --filter '@etus/bhono...'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Quality gates — block the publish if any of these fail.
      # `build` runs tsc, which doubles as typecheck for the CLI.
      - name: Test @etus/bhono
        run: pnpm -C packages/bhono-app test:run

      - name: Build @etus/bhono
        run: pnpm -C packages/bhono-app build

      - name: Create release PR or version
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'

      # Idempotent publish: skip if the local version is already on the
      # registry. Without this, a release that only bumps one package would
      # still try to re-publish the others and fail with 403 ("cannot publish
      # over previously published versions"), blocking subsequent steps.
      - name: Publish @etus/bhono to npm (OIDC, restricted)
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/bhono-app
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @etus/bhono version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "@etus/bhono@$LOCAL already on registry — skipping publish."
          else
            echo "Publishing @etus/bhono@$LOCAL (was $PUBLISHED)…"
            # Drop NODE_AUTH_TOKEN before publish so npm exchanges the OIDC
            # id-token via Trusted Publisher instead of using the token (which
            # has 2FA enabled and would trigger EOTP at the registry).
            unset NODE_AUTH_TOKEN
            npm publish --access restricted
          fi
        env:
          HUSKY: '0'
          # `npm view` needs read auth for restricted @etus packages.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Each package needs its own Trusted Publisher config on npmjs:
      # https://www.npmjs.com/package/@etus/create-bhono/access
      # (Organization: etusdigital, Repo: bhono, Workflow: release.yml)
      # @etus/create-bhono is published with --access public — its job is
      # `npx @etus/create-bhono <project>`, has to be installable by anyone.
      - name: Publish @etus/create-bhono to npm (OIDC, public)
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/create-bhono
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @etus/create-bhono version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "@etus/create-bhono@$LOCAL already on registry — skipping publish."
          else
            echo "Publishing @etus/create-bhono@$LOCAL (was $PUBLISHED)…"
            # Drop NODE_AUTH_TOKEN before publish so npm uses OIDC Trusted
            # Publisher instead of the 2FA-required token (EOTP otherwise).
            unset NODE_AUTH_TOKEN
            npm publish --access public
          fi
        env:
          HUSKY: '0'
          # `npm view` here doesn't strictly need auth (@etus/create-bhono is
          # public), but kept for consistency with the @etus/bhono step.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
