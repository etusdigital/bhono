name: Release

# Publishes @etus/bhono (packages/bhono-app) to npm.
#
# Trigger: push to master/main (changesets opens/merges the release PR which
# triggers this workflow again to publish), or manual workflow_dispatch.
#
# Publish auth: npm Trusted Publisher (OIDC) — no NPM_TOKEN secret required.
# Configure once at https://www.npmjs.com/package/@etus/bhono/settings, then
# the `id-token: write` permission below is sufficient. Mirrors the pattern
# used by @etus/auth (aabrius/oauth-gateway/.github/workflows/publish-auth.yml).
#
# Pre-publish quality gates run before `npm publish` so a broken build/test
# never reaches the registry. We use the npm CLI (not pnpm) for the publish
# step itself — npm has first-class OIDC trusted-publisher support; pnpm's
# exchange handshake is less mature and currently 404s on the npm side.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write       # changesets/action needs to push the release PR
  pull-requests: write  # changesets/action opens the release PR
  id-token: write       # npm OIDC trusted publisher

jobs:
  release:
    name: Release @etus/bhono
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm to >=11.5.1 (trusted-publisher support)
        run: npm install -g npm@latest

      - name: Install CLI dependencies only
        # --filter '@etus/bhono...' scopes the install to the CLI workspace
        # and its transitive deps. The boilerplate's @etus/auth dep (consumed
        # only by src/server/*, never by the CLI) is never fetched here, so
        # publish doesn't need a token with @etus read scope. OIDC trusted
        # publisher handles publish auth on its own.
        run: pnpm install --frozen-lockfile --filter '@etus/bhono...'

      # Quality gates — block the publish if any of these fail.
      # `build` runs tsc, which doubles as typecheck for the CLI.
      - name: Test @etus/bhono
        run: pnpm -C packages/bhono-app test:run

      - name: Build @etus/bhono
        run: pnpm -C packages/bhono-app build

      - name: Create release PR or version
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'

      - name: Publish to npm (OIDC trusted publisher, restricted)
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/bhono-app
        run: npm publish --access restricted --provenance
        env:
          HUSKY: '0'
