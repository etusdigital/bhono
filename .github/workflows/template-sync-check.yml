name: Template Sync Check

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

jobs:
  check-sync:
    name: Sync Template with Boilerplate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run sync script
        run: ./scripts/sync-template.sh

      - name: Commit sync if needed
        run: |
          if [ -n "$(git status --porcelain packages/bhono-app/templates/)" ]; then
            echo "Template out of sync — committing automatically..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add packages/bhono-app/templates/
            git commit -m "chore(template): sync template with boilerplate [skip ci]"
            git push
            echo "Sync committed successfully."
          else
            echo "Template is already in sync."
          fi
