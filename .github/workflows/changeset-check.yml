name: Changeset Check

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  changeset-check:
    name: Check for changesets
    runs-on: ubuntu-latest
    # Skip for changesets version PRs
    if: ${{ github.head_ref != 'changeset-release/master' && github.head_ref != 'changeset-release/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if package changes require changeset
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Check if any package files were changed
          PACKAGE_CHANGES=$(echo "$CHANGED_FILES" | grep -E "^packages/" || true)

          if [ -z "$PACKAGE_CHANGES" ]; then
            echo "✅ No package changes detected, changeset not required"
            exit 0
          fi

          echo "📦 Package changes detected:"
          echo "$PACKAGE_CHANGES"
          echo ""

          # Check if there are any changeset files (excluding README)
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)

          if [ "$CHANGESETS" -eq 0 ]; then
            echo ""
            echo "::error::Package changes detected but no changeset found!"
            echo ""
            echo "Please run 'pnpm changeset' to create one, then commit the file."
            echo ""
            echo "If this change doesn't need a release, create an empty changeset:"
            echo "  pnpm changeset --empty"
            exit 1
          fi

          echo ""
          echo "✅ Found $CHANGESETS changeset(s) for package changes"
