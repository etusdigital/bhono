name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Principle of least privilege
permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '20'
  PNPM_VERSION: '10.15.1'

jobs:
  # All checks consolidated - tests already ran locally via pre-push
  ci:
    name: Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          # registry-url makes setup-node write a ~/.npmrc that pnpm reads —
          # the _authToken interpolates from NODE_AUTH_TOKEN at install time,
          # so the secret never lands on disk in plaintext.
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Required so the runner can fetch @etus/* packages (restricted on npmjs).
          # NPM_TOKEN must be a granular token with read access on the @etus scope.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build CLI package
        run: pnpm -C packages/bhono-app build
