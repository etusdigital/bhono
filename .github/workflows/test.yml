name: CI

# Quality gates for the @etus/bhono CLI — the only deliverable shipped from
# this monorepo. The boilerplate code under src/ is template material that
# gets scaffolded into new projects; its quality is enforced locally via the
# pre-push hook (typecheck + tests) where the developer's own ~/.npmrc has
# @etus scope access. CI installs only the CLI workspace via filter, but
# pnpm still resolves the full lockfile — so NPM_TOKEN with @etus read
# scope is needed on every cache-missing run (lockfile changes invalidate
# the pnpm store cache between runs).

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '20'
  PNPM_VERSION: '10.15.1'

jobs:
  cli:
    name: Code Quality (CLI)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install CLI dependencies only
        # --filter '@etus/bhono...' restricts what ends up in node_modules,
        # but pnpm still resolves the full lockfile — so the @etus/* tarball
        # auth check still runs and needs NPM_TOKEN with @etus read scope.
        run: pnpm install --frozen-lockfile --filter '@etus/bhono...'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test CLI
        run: pnpm -C packages/bhono-app test:run

      - name: Build CLI
        run: pnpm -C packages/bhono-app build
