name: CI

# Quality gates for the @etus/bhono CLI — the only deliverable shipped from
# this monorepo. The boilerplate code under src/ is template material that
# gets scaffolded into new projects; its quality is enforced locally via the
# pre-push hook (typecheck + tests) where the developer's own ~/.npmrc has
# @etus scope access. CI deliberately stays scoped to the CLI so no
# NPM_TOKEN with @etus read access is needed in GitHub Actions secrets.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '20'
  PNPM_VERSION: '10.15.1'

jobs:
  cli:
    name: Code Quality (CLI)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install CLI dependencies only
        # --filter '@etus/bhono...' restricts the install to the CLI workspace
        # and its transitive deps — the boilerplate's @etus/auth dep is never
        # fetched in CI, so no NPM_TOKEN with @etus read scope is needed.
        run: pnpm install --frozen-lockfile --filter '@etus/bhono...'

      - name: Test CLI
        run: pnpm -C packages/bhono-app test:run

      - name: Build CLI
        run: pnpm -C packages/bhono-app build
